[project]
name = "rtos-subhealth-agent"
version = "0.1.0"
description = "LangChain CLI agent for the ROS Subhealth MCP server"
requires-python = ">=3.10"
dependencies = [
    "langchain[mcp]>=1.4,<1.5",
    "langchain-openai>=1.6,<1.7",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "runtime", "settings"]
