services:
  backend:
    build:
      context: ../..
      dockerfile: docker/package/Dockerfile
      target: backend
      args:
        ROS_BUILD_IMAGE: ${ROS_BUILD_IMAGE:-ros-dev:jazzy}

  frontend:
    build:
      context: ../..
      dockerfile: docker/package/Dockerfile
      target: frontend
      args:
        ROS_BUILD_IMAGE: ${ROS_BUILD_IMAGE:-ros-dev:jazzy}
