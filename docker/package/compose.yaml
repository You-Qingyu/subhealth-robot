name: rtos-subhealth-demo

services:
  backend:
    image: rtos-subhealth-demo:jazzy
    init: true
    environment:
      ROS_DOMAIN_ID: "1"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_TASK_CLIENT_CONFIG: /opt/app/ros2_ws/config/devices.yaml
      MAP_CONFIG: /opt/app/ros2_ws/config/maps/default.yaml
      GATEWAY_HTTP_PORT: "5000"
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/tasks', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - demo

  frontend:
    image: rtos-subhealth-web:jazzy
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - demo

  agent:
    image: rtos-subhealth-demo:jazzy
    profiles:
      - agent
    entrypoint:
      - /opt/app/agent/.venv/bin/python
      - /opt/app/agent/cli.py
    environment:
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      GATEWAY_URL: http://backend:5000
      ROS_TASK_CLIENT_CONFIG: /opt/app/ros2_ws/config/devices.yaml
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - demo

networks:
  demo:
    driver: bridge
