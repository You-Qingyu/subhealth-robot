[project]
name = "rtos-subhealth-mcp"
version = "0.1.0"
description = "Local MCP interface for the ROS Subhealth Gateway"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "websockets>=13,<17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "settings", "gateway_client"]
