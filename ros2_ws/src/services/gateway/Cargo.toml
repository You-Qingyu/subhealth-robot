[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
platform = { path = "../platform", version = "0.1.0" }
orchestration = { path = "../orchestration", version = "0.1.0" }
task_repository = { path = "../task_repository", version = "0.1.0" }
execution = { path = "../execution", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws", "json"] }

[features]
default = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
